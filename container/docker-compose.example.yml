# Reference template for docker-compose.yml.
# launch.sh generates docker-compose.yml automatically at launch time —
# do not copy this file manually.  This example exists for documentation only.

services:
  claude-worker:
    build:
      context: .
    environment:
      - AGENT_NAME=${AGENT_NAME:-agent-1}
      - WORK_BRANCH=${WORK_BRANCH:-main}
      - AGENT_TYPE=${AGENT_TYPE:?Set AGENT_TYPE in .env}
      # Preferred auth: long-lived OAuth token from `claude setup-token`
      # (sk-ant-oat01-...). Read from this env var; takes precedence over a
      # mounted .credentials.json. Leave empty to use a credentials file or key.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_EFFORT=${CLAUDE_EFFORT:-high}
      - MAX_TURNS=${MAX_TURNS:-200}
      - SERVER_URL=http://host.docker.internal:${SERVER_PORT:-9100}
      # Hook config — set these to match your project's build/test scripts
      - BUILD_SCRIPT_NAME=${BUILD_SCRIPT_NAME:-build.py}
      - TEST_SCRIPT_NAME=${TEST_SCRIPT_NAME:-run_tests.py}
      - DEFAULT_TEST_FILTERS=${DEFAULT_TEST_FILTERS:-}
      - LOG_VERBOSITY=${LOG_VERBOSITY:-verbose}
      - WORKER_MODE=${WORKER_MODE:-false}
      - WORKER_POLL_INTERVAL=${WORKER_POLL_INTERVAL:-30}
      - WORKER_SINGLE_TASK=${WORKER_SINGLE_TASK:-true}
      - HOOK_CPP_LINT=${HOOK_CPP_LINT:-false}
      - PROJECT_ID=${PROJECT_ID:-default}
    volumes:
      # Required: bare repo for git operations
      - ${BARE_REPO_PATH:?Set BARE_REPO_PATH}:/repo.git
      # Host-side logs (exit logs persist after container shutdown for forensic review)
      - ${LOGS_PATH:-./logs}:/logs
      # Claude authentication (pick one):
      # Option A (preferred) — long-lived OAuth token: set CLAUDE_CODE_OAUTH_TOKEN
      #   in .env (wired into the environment block above). No mount needed.
      # Option B — OAuth credentials file: add an absolute-path mount here
      #   (~ does not expand reliably on Windows):
      #   - /abs/path/.credentials.json:/home/claude/.claude/.credentials.json:ro
      # Option C — API key: set ANTHROPIC_API_KEY in the environment above instead
      # Agent definitions (container-orchestrator, etc.)
      - ${AGENTS_PATH:-../agents}:/staged-agents:ro
      # UE engine (read-only, optional — omit or set to /dev/null for non-UE projects)
      - ${UE_ENGINE_PATH:-/dev/null}:/engine:ro
      # Optional: read-only plugin mounts (symlinked into Plugins/ at startup)
      # Add entries like:
      # - /path/to/MyPlugin:/plugins-ro/MyPlugin:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

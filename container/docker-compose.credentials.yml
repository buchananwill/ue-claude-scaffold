# Optional overlay: mount a host-side Claude OAuth credentials file into the
# container at /home/claude/.claude/.credentials.json (read-only).
#
# launch.sh layers this file on top of docker-compose.template.yml ONLY when
# CLAUDE_CREDENTIALS_PATH is set in .env. The default authentication path is the
# CLAUDE_CODE_OAUTH_TOKEN env var (see docker-compose.template.yml); this overlay
# exists for operators who still authenticate via an interactive-login
# credentials file instead of a long-lived token.

services:
  claude-worker:
    volumes:
      - ${CLAUDE_CREDENTIALS_PATH:?Set CLAUDE_CREDENTIALS_PATH in .env}:/home/claude/.claude/.credentials.json:ro
